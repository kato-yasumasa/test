<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Multi-Person AI Thermal Scanner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- MediaPipe Face Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

    <style>
        body {
            background-color: #030712;
            color: #00f0ff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .glass-panel {
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        .scanlines::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            z-index: 10;
            background-size: 100% 3px;
            pointer-events: none;
        }

        @keyframes laserScan {
            0% { top: 0%; opacity: 0.8; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0.8; }
        }
        .laser-bar {
            position: absolute;
            left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f0ff, #ef4444, transparent);
            box-shadow: 0 0 10px #00f0ff;
            animation: laserScan 3s linear infinite;
            pointer-events: none;
            z-index: 11;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between select-none">

    <!-- Top Header Bar -->
    <header class="w-full glass-panel p-3 flex justify-between items-center z-20 border-b border-cyber-neon/30">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-lg bg-cyan-500/10 border border-cyan-400 flex items-center justify-center text-cyan-400">
                <i class="fa-solid fa-temperature-arrow-up text-sm"></i>
            </div>
            <div>
                <h1 class="font-orbitron font-extrabold text-sm text-cyan-400 tracking-wider">
                    THERMO-SCANNER <span class="text-[9px] bg-cyan-950 border border-cyan-500/40 text-cyan-300 px-1.5 py-0.5 rounded">MULTI-AI</span>
                </h1>
                <p class="text-[10px] text-gray-400">複数人自動体温・属性トラッキング</p>
            </div>
        </div>

        <!-- Detected Status Counters -->
        <div class="flex items-center space-x-2 font-orbitron text-xs">
            <div class="bg-slate-900/90 px-2.5 py-1 rounded border border-cyan-500/40">
                <span class="text-gray-400 text-[10px]">DETECTED:</span>
                <span id="people-count" class="text-cyan-400 font-bold text-sm ml-1">0</span>
            </div>
        </div>
    </header>

    <!-- Main Camera Viewport -->
    <main class="flex-grow relative w-full h-full bg-black overflow-hidden flex items-center justify-center scanlines">
        
        <!-- Laser Scanning Overlay -->
        <div class="laser-bar"></div>

        <!-- Raw Video (Hidden processing source) -->
        <video id="webcam" playsinline autoplay muted class="hidden"></video>

        <!-- Canvas for Thermal Rendering & HUD Overlay -->
        <canvas id="output-canvas" class="w-full h-full object-cover relative z-10"></canvas>

        <!-- Thermal Scale Indicator Bar (Right side) -->
        <div class="absolute right-3 top-1/2 -translate-y-1/2 z-20 flex flex-col items-center space-y-1 glass-panel p-1.5 rounded-lg border border-cyan-500/30">
            <span class="text-[9px] font-orbitron text-red-400 font-bold">38°C</span>
            <div class="w-2.5 h-32 rounded bg-gradient-to-t from-blue-600 via-green-400 via-yellow-400 to-red-500 border border-slate-700"></div>
            <span class="text-[9px] font-orbitron text-blue-400 font-bold">34°C</span>
        </div>

        <!-- Standby Overlay -->
        <div id="start-overlay" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-slate-950/90 p-6 text-center backdrop-blur-sm">
            <div class="w-16 h-16 rounded-full border border-cyan-400/50 flex items-center justify-center text-cyan-400 text-2xl mb-4 bg-cyan-500/10 animate-pulse">
                <i class="fa-solid fa-users-viewfinder"></i>
            </div>
            <h2 class="font-orbitron font-bold text-lg text-white mb-2">複数人サーモグラフィースキャナー</h2>
            <p class="text-xs text-gray-400 max-w-xs mb-6">離れた場所（引きの画角）からでも画面内の全員を自動で識別し、体温と属性を疑似解析表示します。</p>
            <button id="start-btn" class="bg-cyan-500 hover:bg-cyan-400 text-black font-orbitron font-extrabold px-6 py-3 rounded-xl text-sm transition shadow-[0_0_15px_rgba(0,240,255,0.4)]">
                <i class="fa-solid fa-power-off mr-2"></i>スキャナー起動
            </button>
        </div>
    </main>

    <!-- Bottom Controls Footer -->
    <footer class="w-full glass-panel p-3 z-20 border-t border-cyan-500/30 flex justify-between items-center gap-2">
        <button id="toggle-thermal-btn" class="flex-1 bg-slate-900 border border-cyan-500/50 text-cyan-400 font-orbitron text-xs font-semibold py-2.5 rounded-lg flex items-center justify-center gap-1.5 active:bg-cyan-950">
            <i class="fa-solid fa-eye"></i><span id="thermal-btn-label">サーモモード: ON</span>
        </button>

        <button id="switch-cam-btn" class="flex-1 bg-slate-900 border border-slate-700 text-gray-300 font-orbitron text-xs font-semibold py-2.5 rounded-lg flex items-center justify-center gap-1.5 active:bg-slate-800">
            <i class="fa-solid fa-rotate"></i><span>カメラ切替</span>
        </button>
    </footer>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const peopleCountEl = document.getElementById('people-count');
        const startOverlay = document.getElementById('start-overlay');
        const startBtn = document.getElementById('start-btn');
        const toggleThermalBtn = document.getElementById('toggle-thermal-btn');
        const thermalBtnLabel = document.getElementById('thermal-btn-label');
        const switchCamBtn = document.getElementById('switch-cam-btn');

        let cameraInstance = null;
        let faceDetection = null;
        let isThermalActive = true;
        let facingMode = 'user'; // 'user' (インカメ) or 'environment' (アウトカメ)
        let detectionsCache = [];

        // Pre-generated pseudo-temperatures and attributes for tracking consistency
        const personMetaMap = new Map();

        // Thermal Lookup Table (LUT) for fast rendering
        const thermalLUT = new Uint8ClampedArray(256 * 3);
        for (let i = 0; i < 256; i++) {
            const val = i / 255;
            let r = 0, g = 0, b = 0;
            if (val < 0.25) {
                b = Math.floor(val * 4 * 255);
            } else if (val < 0.5) {
                g = Math.floor((val - 0.25) * 4 * 255);
                b = Math.floor((0.5 - val) * 4 * 255);
            } else if (val < 0.75) {
                r = Math.floor((val - 0.5) * 4 * 255);
                g = 255;
            } else {
                r = 255;
                g = Math.floor((1 - val) * 4 * 255);
            }
            thermalLUT[i * 3] = r;
            thermalLUT[i * 3 + 1] = g;
            thermalLUT[i * 3 + 2] = b;
        }

        function initFaceDetection() {
            faceDetection = new FaceDetection({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
            });

            faceDetection.setOptions({
                model: 'short',
                minDetectionConfidence: 0.45
            });

            faceDetection.onResults((results) => {
                detectionsCache = results.detections || [];
            });
        }

        function getPersonMeta(idIndex) {
            if (!personMetaMap.has(idIndex)) {
                const genders = ['男性', '女性'];
                const ages = ['20代', '30代', '40代'];
                // Generate base body temperature around 36.3°C - 36.8°C
                const baseTemp = (36.3 + Math.random() * 0.5).toFixed(1);
                const gender = genders[idIndex % genders.length];
                const age = ages[(idIndex * 2) % ages.length];

                personMetaMap.set(idIndex, {
                    temp: baseTemp,
                    gender: gender,
                    age: age
                });
            }
            return personMetaMap.get(idIndex);
        }

        function renderFrame() {
            if (video.readyState >= 2) {
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;

                const width = canvas.width;
                const height = canvas.height;

                // 1. Draw original video onto canvas
                ctx.save();
                if (facingMode === 'user') {
                    ctx.translate(width, 0);
                    ctx.scale(-1, 1);
                }
                ctx.drawImage(video, 0, 0, width, height);
                ctx.restore();

                // 2. Apply Thermal Color LUT Shader if active
                if (isThermalActive) {
                    const imageData = ctx.getImageData(0, 0, width, height);
                    const data = imageData.data;
                    const len = data.length;

                    for (let i = 0; i < len; i += 4) {
                        // Fast luminance calculation
                        const lum = (data[i] * 299 + data[i + 1] * 587 + data[i + 2] * 114) >> 10;
                        const lutIdx = lum * 3;
                        data[i] = thermalLUT[lutIdx];
                        data[i + 1] = thermalLUT[lutIdx + 1];
                        data[i + 2] = thermalLUT[lutIdx + 2];
                    }
                    ctx.putImageData(imageData, 0, 0);
                }

                // 3. Render Multi-Person Bounding HUDs & Temperature Labels
                const count = detectionsCache.length;
                peopleCountEl.textContent = count;

                detectionsCache.forEach((detection, idx) => {
                    const bbox = detection.boundingBox;
                    const x = bbox.xCenter * width - (bbox.width * width) / 2;
                    const y = bbox.yCenter * height - (bbox.height * height) / 2;
                    const w = bbox.width * width;
                    const h = bbox.height * height;

                    const drawX = facingMode === 'user' ? width - x - w : x;
                    const meta = getPersonMeta(idx);

                    // Expand bounding frame to fit full body / upper torso
                    const framePadX = w * 0.3;
                    const framePadY = h * 0.2;
                    const boxX = Math.max(0, drawX - framePadX);
                    const boxY = Math.max(0, y - framePadY);
                    const boxW = Math.min(width - boxX, w + framePadX * 2);
                    const boxH = Math.min(height - boxY, h + framePadY * 3);

                    const isFever = parseFloat(meta.temp) >= 37.5;
                    const strokeColor = isFever ? '#ef4444' : '#00f0ff';

                    // Cyber Bounding Corner Frames
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = 2;
                    ctx.strokeRect(boxX, boxY, boxW, boxH);

                    // Temperature HUD Label Tag above person
                    const tagY = Math.max(30, boxY - 10);
                    const tagW = 165;
                    const tagH = 26;

                    ctx.fillStyle = 'rgba(3, 7, 18, 0.9)';
                    ctx.fillRect(boxX, tagY - 24, tagW, tagH);
                    ctx.strokeStyle = strokeColor;
                    ctx.lineWidth = 1;
                    ctx.strokeRect(boxX, tagY - 24, tagW, tagH);

                    // Text Content
                    ctx.fillStyle = strokeColor;
                    ctx.font = 'bold 11px Orbitron, sans-serif';
                    ctx.fillText(`P#${idx + 1} | ${meta.temp}°C | ${meta.gender}`, boxX + 6, tagY - 8);
                });
            }

            requestAnimationFrame(renderFrame);
        }

        async function startCamera() {
            if (!faceDetection) initFaceDetection();

            if (cameraInstance) {
                await cameraInstance.stop();
            }

            cameraInstance = new Camera(video, {
                onFrame: async () => {
                    if (video.readyState >= 2) {
                        await faceDetection.send({ image: video });
                    }
                },
                width: { ideal: 1280 },
                height: { ideal: 720 },
                facingMode: facingMode
            });

            await cameraInstance.start();
            startOverlay.classList.add('hidden');
        }

        // Toggle Thermal Color Shader
        toggleThermalBtn.addEventListener('click', () => {
            isThermalActive = !isThermalActive;
            thermalBtnLabel.textContent = `サーモモード: ${isThermalActive ? 'ON' : 'OFF'}`;
            toggleThermalBtn.classList.toggle('border-cyan-500/50', isThermalActive);
            toggleThermalBtn.classList.toggle('border-slate-700', !isThermalActive);
        });

        // Switch Camera (Front / Rear)
        switchCamBtn.addEventListener('click', async () => {
            facingMode = (facingMode === 'user') ? 'environment' : 'user';
            await startCamera();
        });

        startBtn.addEventListener('click', startCamera);
        requestAnimationFrame(renderFrame);
    </script>
</body>
</html>
