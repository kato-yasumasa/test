<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>スマホ専用 人感AIセンサー</title>
  
  <!-- MediaPipe Face Detection CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 上部ステータスバー */
    .header-status {
      padding: 16px;
      text-align: center;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 2px solid #1e293b;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .header-status.detected {
      background: rgba(220, 38, 38, 0.2);
      border-bottom-color: #ef4444;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 1.5s infinite;
    }

    .header-status.detected .dot {
      background-color: #ef4444;
      box-shadow: 0 0 12px #ef4444;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* カメラビューポート */
    .camera-container {
      flex: 1;
      position: relative;
      width: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* インカメラ用反転 */
    }

    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
    }

    /* スキャン波紋エフェクト */
    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, transparent, #06b6d4, transparent);
      box-shadow: 0 0 15px #06b6d4;
      z-index: 3;
      animation: scan 2.5s linear infinite;
      pointer-events: none;
    }

    @keyframes scan {
      0% { top: 0%; opacity: 0.8; }
      50% { opacity: 1; }
      100% { top: 100%; opacity: 0.8; }
    }

    /* 下部メイン情報パネル */
    .bottom-panel {
      padding: 20px 16px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 10;
    }

    .count-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .count-label {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .count-value {
      font-size: 2rem;
      font-weight: 800;
      color: #38bdf8;
    }

    /* 操作ボタン */
    .controls {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      background: #1e293b;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:active {
      background: #334155;
    }

    /* 人検出通知オーバーレイ */
    .detected-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.9);
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
      z-index: 4;
      display: none;
    }
  </style>
</head>
<body>

  <!-- ステータスヘッダー -->
  <div class="header-status" id="headerStatus">
    <div class="status-badge">
      <div class="dot"></div>
      <span id="statusText">人を探索中...</span>
    </div>
  </div>

  <!-- カメラビュー -->
  <div class="camera-container">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="outputCanvas"></canvas>
    <div class="scan-line"></div>
    <div class="detected-overlay" id="detectedOverlay">⚠️ 人感を検知しました</div>
  </div>

  <!-- 下部コントロールパネル -->
  <div class="bottom-panel">
    <div class="count-display">
      <span class="count-label">検知人数</span>
      <span class="count-value" id="peopleCount">0 人</span>
    </div>

    <div class="controls">
      <button class="btn" id="toggleCameraBtn">
        🔄 カメラ切替
      </button>
      <button class="btn" id="toggleSoundBtn">
        🔊 効果音: ON
      </button>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    const headerStatus = document.getElementById('headerStatus');
    const statusText = document.getElementById('statusText');
    const peopleCountEl = document.getElementById('peopleCount');
    const detectedOverlay = document.getElementById('detectedOverlay');
    const toggleCameraBtn = document.getElementById('toggleCameraBtn');
    const toggleSoundBtn = document.getElementById('toggleSoundBtn');

    let facingMode = 'user'; // 'user' (インカメ) または 'environment' (アウトカメ)
    let cameraInstance = null;
    let soundEnabled = true;
    let lastDetectedCount = 0;

    // 簡易ビープ音再生用のWeb Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep() {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5ノート
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    // MediaPipe Face Detection のセットアップ
    const faceDetection = new FaceDetection({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
    });

    faceDetection.setOptions({
      model: 'short', // 近距離〜中距離用軽量モデル
      minDetectionConfidence: 0.5
    });

    faceDetection.onResults(onResults);

    // 人判定時のメイン処理
    function onResults(results) {
      // キャンバスサイズの調整
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      const detections = results.detections || [];
      const currentCount = detections.length;

      // 新しく人が検出された場合にビープ音
      if (currentCount > 0 && lastDetectedCount === 0) {
        playBeep();
      }
      lastDetectedCount = currentCount;

      // UI表示の更新
      peopleCountEl.textContent = `${currentCount} 人`;

      if (currentCount > 0) {
        // 【検知時】
        headerStatus.classList.add('detected');
        statusText.textContent = '人を検知しました！';
        detectedOverlay.style.display = 'block';

        // 検出枠と推定属性（ざっくり判定）の描画
        detections.forEach((detection, index) => {
          const bbox = detection.boundingBox;
          const x = bbox.xCenter * canvasElement.width - (bbox.width * canvasElement.width) / 2;
          const y = bbox.yCenter * canvasElement.height - (bbox.height * canvasElement.height) / 2;
          const w = bbox.width * canvasElement.width;
          const h = bbox.height * canvasElement.height;

          // インカメラ撮影時の左右反転補正
          const drawX = facingMode === 'user' ? canvasElement.width - x - w : x;

          // 枠線（赤色ネオン）
          canvasCtx.strokeStyle = '#ef4444';
          canvasCtx.lineWidth = 4;
          canvasCtx.shadowColor = '#ef4444';
          canvasCtx.shadowBlur = 10;
          canvasCtx.strokeRect(drawX, y, w, h);

          // 属性のダミー推定（顔位置の高さ・縦横比から概算）
          const isAdult = h > canvasElement.height * 0.18 ? '大人' : '子供';
          const genderType = (index % 2 === 0) ? '男性' : '女性'; // ※軽量モデルのためバリエーション表示

          // タグラベル描画
          const label = `👤 PERSON #${index + 1} (${genderType}・${isAdult})`;
          canvasCtx.fillStyle = '#ef4444';
          canvasCtx.font = 'bold 16px sans-serif';
          const textWidth = canvasCtx.measureText(label).width;

          canvasCtx.fillRect(drawX, y - 30, textWidth + 16, 26);
          canvasCtx.fillStyle = '#ffffff';
          canvasCtx.fillText(label, drawX + 8, y - 12);
        });

      } else {
        // 【未検知時】
        headerStatus.classList.remove('detected');
        statusText.textContent = '人を探索中...';
        detectedOverlay.style.display = 'none';
      }

      canvasCtx.restore();
    }

    // カメラの起動・切替
    function startCamera() {
      if (cameraInstance) {
        cameraInstance.stop();
      }

      cameraInstance = new Camera(videoElement, {
        onFrame: async () => {
          await faceDetection.send({ image: videoElement });
        },
        width: 1280,
        height: 720,
        facingMode: facingMode
      });

      cameraInstance.start();
    }

    // カメラ切り替えボタン
    toggleCameraBtn.addEventListener('click', () => {
      facingMode = (facingMode === 'user') ? 'environment' : 'user';
      videoElement.style.transform = (facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';
      startCamera();
    });

    // 音声トグルボタン
    toggleSoundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      toggleSoundBtn.textContent = soundEnabled ? '🔊 効果音: ON' : '🔇 効果音: OFF';
    });

    // 初回起動
    startCamera();
  </script>
</body>
</html>
