<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケカくじ - 結果発表</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #2c2c2c;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* アプリ全体を覆うメインコンテナ */
    .app-screen {
      width: 100%;
      max-width: 400px;
      height: 100%;
      max-height: 700px;
      background-color: #333333;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* ヘッダーエリア */
    .header {
      background-color: #ba2328;
      padding: 16px 0;
      text-align: center;
      border-bottom: 4px solid #1a1a1a;
      flex-shrink: 0;
    }

    .title-logo {
      color: #ffffff;
      font-size: 32px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1px;
      text-shadow: 
        3px 3px 0 #000,
       -2px 2px 0 #000,
        2px -2px 0 #000,
       -2px -2px 0 #000,
        0 4px 6px rgba(0,0,0,0.6);
      display: inline-block;
      transform: scaleY(1.1);
    }

    /* メインコンテンツエリア（結果表示） */
    .content {
      flex: 1;
      padding: 20px 20px 10px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .kuji-title {
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-align: center;
    }

    /* エクストラくじセクション */
    .extra-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    /* スタンダードくじセクション */
    .standard-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    /* 賞アイテム共通 */
    .prize-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .prize-name {
      color: #ffffff;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .prize-name ruby rt {
      font-size: 8px;
      color: #cccccc;
    }

    /* パック画像（ダミー画像） */
    .pack-image {
      width: 55px;
      height: 78px;
      background-color: #4a4a4a;
      border: 2px solid #555;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .pack-count {
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
    }

    /* スタンダードくじのグリッド配置 */
    .standard-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      row-gap: 15px;
      column-gap: 8px;
      justify-items: center;
    }

    .standard-grid .prize-item:nth-child(6) {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
      margin-top: -5px;
    }

    .pack-image.special {
      width: 65px;
      display: flex;
      position: relative;
    }
    
    .pack-image.special div {
      width: 50%;
      height: 100%;
    }
    
    .pack-image.special .red-banner {
      width: 10px;
      height: 10px;
      background-color: #ff3333;
      color: white;
      font-size: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      bottom: 2px;
      right: 2px;
      border-radius: 2px;
    }

    /* フッター／戻るボタンエリア */
    .footer-area {
      width: 100%;
      padding: 10px 0 15px 0;
      display: flex;
      justify-content: center;
      margin-top: auto;
    }

    /* 戻るボタンのスタイル */
    .btn-back {
      display: inline-block;
      width: 70%;
      padding: 6px 0;
      background-color: #ffffff;
      color: #333333;
      text-decoration: none;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-back:active {
      background-color: #dddddd;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="app-screen">
    <!-- ヘッダー -->
    <header class="header">
      <div class="title-logo">ポケカくじ</div>
    </header>

    <!-- メインエリア（結果） -->
    <main class="content">
      
      <!-- エクストラくじセクション -->
      <div class="extra-section">
        <div class="kuji-title">エクストラくじ</div>
        
        <div class="prize-item">
          <div class="prize-name">
            ⑥<ruby>4pc<rt>しょう</rt></ruby>賞
          </div>
          <div class="pack-image"></div>
          <div class="pack-count">4パック</div>
        </div>
      </div>

      <!-- スタンダードくじセクション -->
      <div class="standard-section">
        <div class="kuji-title">スタンダードくじ</div>
        
        <div class="standard-grid">
          <div class="prize-item">
            <div class="prize-name">②<ruby>特賞<rt>しょう</rt></ruby></div>
            <div class="pack-image special">
              <div style="background-color: #555;"></div>
              <div style="background-color: #666;"></div>
              <div class="red-banner">6</div>
            </div>
            <div class="pack-count">30パック</div>
          </div>
          
          <div class="prize-item">
            <div class="prize-name">⑧<ruby>4pc<rt>しょう</rt></ruby>賞</div>
            <div class="pack-image"></div>
            <div class="pack-count">4パック</div>
          </div>
          
          <div class="prize-item">
            <div class="prize-name">⑨<ruby>4pc<rt>しょう</rt></ruby>賞</div>
            <div class="pack-image"></div>
            <div class="pack-count">4パック</div>
          </div>
          
          <div class="prize-item">
            <div class="prize-name">⑩<ruby>4pc<rt>しょう</rt></ruby>賞</div>
            <div class="pack-image"></div>
            <div class="pack-count">4パック</div>
          </div>
          
          <div class="prize-item">
            <div class="prize-name">⑪<ruby>4pc<rt>しょう</rt></ruby>賞</div>
            <div class="pack-image"></div>
            <div class="pack-count">4パック</div>
          </div>
          
          <div class="prize-item">
            <div class="prize-name">⑫<ruby>4pc<rt>しょう</rt></ruby>賞</div>
            <div class="pack-image"></div>
            <div class="pack-count">4パック</div>
          </div>
        </div>
      </div>

      <!-- フッター：戻るボタン -->
      <div class="footer-area">
        <a href="index.html" class="btn-back">戻る</a>
      </div>

    </main>

  </div>

</body>
</html>
